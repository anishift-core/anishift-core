<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="AniShift" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1e90ff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#6d28d9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e90ff"/>
      <stop offset="100%" stop-color="#60b0ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="22" fill="#0a0a0a"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Spotlight pill -->
  <rect x="60" y="46" width="150" height="34" rx="17" fill="#141414" stroke="#2a2a2a"/>
  <circle cx="82" cy="63" r="5" fill="#1e90ff"/>
  <text x="96" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">#1 Spotlight</text>

  <!-- Logo -->
  <text x="60" y="180" font-family="Segoe UI, Arial Black, Arial, sans-serif" font-size="104" font-weight="900" letter-spacing="2">
    <tspan fill="#ffffff">ANI</tspan><tspan fill="#1e90ff">SHIFT</tspan>
  </text>

  <rect x="62" y="198" width="120" height="5" rx="2.5" fill="url(#bar)"/>

  <text x="60" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#9ca3af">Sinhala Subtitled Anime Streaming Platform</text>

  <!-- Version banner -->
  <rect x="60" y="266" width="360" height="34" rx="9" fill="#052e1a" stroke="#16a34a"/>
  <circle cx="82" cy="283" r="5" fill="#22c55e"/>
  <text x="98" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#22c55e">AniShift v2.1.0 is now live!</text>

  <!-- Decorative rank chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="900" y="230" width="110" height="30" rx="15" fill="#141414" stroke="#2a2a2a"/>
    <text x="955" y="250" text-anchor="middle" fill="#f59e0b">Chunin</text>
    <rect x="1022" y="230" width="118" height="30" rx="15" fill="#141414" stroke="#2a2a2a"/>
    <text x="1081" y="250" text-anchor="middle" fill="#1e90ff">Anime Genin</text>
    <rect x="900" y="272" width="240" height="8" rx="4" fill="#1a1a1a"/>
    <rect x="900" y="272" width="170" height="8" rx="4" fill="url(#bar)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
